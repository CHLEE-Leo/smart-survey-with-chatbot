# Pretrained causal LLM baseline. Pin revision to a commit for published runs.
seed: 42
data: data/demo_scenarios.jsonl
output_dir: outputs/llm
model:
  backend: llm
  name: Qwen/Qwen2.5-3B-Instruct
  revision: main
  auto_class: AutoModelForCausalLM
  use_processor: false
  quantize: true
  dtype: bfloat16
  device: cuda:0
  max_input_tokens: 4096
  lora_r: 16
  lora_alpha: 32
  lora_target_modules: [q_proj, v_proj]
generation:
  question_max_tokens: 192
  assessment_max_tokens: 1024
simulator:
  backend: http
  base_url: http://localhost:11435/v1
  model: gemma4:e4b
  api_key_env: SURVEY_SIMULATOR_API_KEY
  temperature: 0.0
  timeout: 90.0
  max_tokens: 256
environment:
  max_turns: 12
reward:
  correct: 1.0
  incorrect: -1.0
  incomplete: -0.2
  turn_cost: 0.02
ppo:
  learning_rate: 0.0001
  updates: 100
  sessions_per_update: 4
  epochs: 4
  minibatch_size: 2
  gamma: 1.0
  gae_lambda: 0.95
  clip_ratio: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 1.0
