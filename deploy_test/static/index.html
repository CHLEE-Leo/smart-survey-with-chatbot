<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>식품알레르기 문진 기록</title><link rel="stylesheet" href="/static/styles.css">
</head>
<body><main class="shell">
  <header>
    <p class="eyebrow">FOOD ALLERGY · INTERVIEW</p>
    <h1>아이의 식품 반응을 함께 기록해요</h1>
    <p>기본 정보를 확인한 뒤, 의심 식품별로 경험을 이야기해 주세요.</p>
    <p id="runtimeNotice" class="hint" role="status"></p><div class="steps" id="steps"></div>
  </header>
  <section class="card" id="wizard">
    <form id="profileForm"><div id="fields"></div><p class="error" id="profileError" role="alert"></p>
      <footer><button type="button" class="quiet" id="back">이전</button><button type="button" id="next">다음</button></footer>
    </form>
  </section>
  <section class="card hidden" id="review">
    <h2>입력한 정보를 확인해 주세요</h2><pre id="profileSummary"></pre>
    <p class="error" id="reviewError" role="alert"></p>
    <footer><button type="button" class="quiet" id="editProfile">수정</button><button type="button" id="startInterview">대화 시작</button></footer>
  </section>
  <section class="card hidden" id="chat">
    <div class="chatTop"><div><p class="eyebrow">SECTION E</p><h2 id="foodLabel">식품별 문진</h2></div><span id="progress"></span></div>
    <div id="messages" class="messages" role="log" aria-live="polite"></div>
    <form id="answerForm"><label for="answer">답변<textarea id="answer" required maxlength="4000" placeholder="기억나는 만큼 알려주세요. 잘 모르겠다고 답해도 괜찮아요."></textarea></label>
      <p class="error" id="chatError" role="alert"></p><button type="submit" id="sendAnswer">답변 보내기</button>
    </form>
  </section>
  <section class="card hidden" id="done">
    <h2>문진 기록을 확인해 주세요</h2><p>이 기록은 의료진의 검토를 돕기 위한 자료입니다.</p>
    <div id="result"></div><button type="button" onclick="location.reload()">새로 시작</button>
  </section>
</main><script src="/static/app.js"></script></body></html>
